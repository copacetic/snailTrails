[pytest]
# Pytest configuration for Snail Trails

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Coverage options (optional)
# --cov=src
# --cov-report=html
# --cov-report=term-missing

# Markers
markers =
    gpu: tests that require GPU/OpenGL context (may be skipped in CI)
    slow: slow running tests
    integration: integration tests

# Ignore warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
